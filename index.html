<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>متجر الجمال</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<meta name="theme-color" content="#C2185B">
<style>
:root{--p:#C2185B;--pc:#FCE4EC;--g:#B8860B;--gc:#FFF4D6;--bg:#FFF9FB;--t:#2a1620;--m:#7a6670;--ok:#16a34a;--no:#dc2626}
*{box-sizing:border-box;margin:0}
body{font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--t);padding-bottom:30px}
header{background:var(--p);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:19px}
button,.btn{font-family:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--p);color:#fff;font-size:14px}
.sec{background:var(--gc);color:#6b4e00}.ghost{background:var(--pc);color:var(--p)}.danger{background:var(--no)}
input,select,textarea{font-family:inherit;width:100%;padding:10px;border:1px solid #e6cfd8;border-radius:10px;margin:4px 0;font-size:15px;background:#fff}
.wrap{padding:12px;max-width:900px;margin:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.chip{white-space:nowrap;background:#fff;border:1px solid #e6cfd8;color:var(--t);padding:7px 13px}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 6px #c2185b1a;display:flex;flex-direction:column}
.card img,.ph{width:100%;aspect-ratio:1;object-fit:cover;background:var(--pc);display:flex;align-items:center;justify-content:center;font-size:40px}
.card .b{padding:9px;display:flex;flex-direction:column;gap:4px;flex:1}
.brand{color:var(--g);font-size:12px}.old{color:var(--m);text-decoration:line-through;font-size:12px}
.price{color:var(--p);font-weight:bold}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;color:#fff;align-self:flex-start}
.ov{position:fixed;inset:0;background:#0007;z-index:20;display:none;align-items:flex-end}
.ov.on{display:flex}
.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px;max-width:700px;margin:auto}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f3e3ea}
.tabs{display:flex;gap:8px;margin:10px 0}
.box{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 6px #c2185b1a}
small{color:var(--m)}.hide{display:none}
</style></head><body>
<div id="store">
<header><h1 id="sn"></h1><button class="sec" onclick="openCart()">🛍️ السلة (<span id="cc">0</span>)</button></header>
<div class="wrap"><input id="q" placeholder="🔍 ابحث عن منتج أو ماركة" oninput="q=this.value;renderStore()">
<div class="chips" id="chips"></div><div class="grid" id="grid"></div>
<p id="empty" class="hide" style="text-align:center;padding:30px;color:var(--m)">لا توجد منتجات</p></div></div>

<div id="admin" class="hide">
<header><h1>لوحة المالك</h1><button class="ghost" onclick="location.hash=''">المتجر</button></header>
<div class="wrap">
<div id="login" class="box"><h3>تسجيل الدخول</h3><input id="em" type="email" placeholder="الإيميل" dir="ltr"><input id="pw" type="password" placeholder="كلمة السر" dir="ltr"><button onclick="login()">دخول</button></div>
<div id="panel" class="hide">
<div class="tabs"><button onclick="tab('p')">المنتجات</button><button class="sec" onclick="tab('o')">الطلبات</button><button class="ghost" onclick="auth.signOut()">خروج</button></div>
<div id="tp"><button onclick="editP()">➕ إضافة منتج</button><div id="plist" style="margin-top:10px"></div></div>
<div id="to" class="hide"></div></div></div></div>

<div class="ov" id="cartOv"><div class="sheet"><div class="row"><h3>🛍️ السلة</h3><button class="ghost" onclick="closeO('cartOv')">إغلاق</button></div>
<div id="cartBody"></div></div></div>
<div class="ov" id="pOv"><div class="sheet"><h3 id="pt">منتج</h3>
<input id="pn" placeholder="اسم المنتج"><input id="pb" placeholder="الماركة">
<select id="pc"></select><input id="pp" type="number" placeholder="السعر (د.ع)"><input id="po" type="number" placeholder="السعر قبل الخصم (اختياري)">
<input id="ps" type="number" placeholder="الكمية بالمخزون"><textarea id="pd" rows="3" placeholder="الوصف / المكونات / طريقة الاستخدام"></textarea>
<input id="pf" type="file" accept="image/*"><label><input id="pa" type="checkbox" checked style="width:auto"> متوفر</label>
<div style="display:flex;gap:8px;margin-top:8px"><button onclick="saveP()">حفظ</button><button class="ghost" onclick="closeO('pOv')">إلغاء</button></div></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== إعدادات سهلة التعديل =====
const STORE="متجر الجمال", FEE=3000;
const CATS=["العناية بالبشرة","المكياج","العطور","العناية بالشعر","العناية بالجسم","أدوات وفرش","هدايا"];
const STATUS=["جديد","قيد التجهيز","في الطريق","مكتمل","ملغي"];
firebase.initializeApp({apiKey:"AIzaSyCd7ZaRKOxIx1T6mJYPDRfV1thhQdqY2SY",authDomain:"cosmetics-3aaa7.firebaseapp.com",projectId:"cosmetics-3aaa7",storageBucket:"cosmetics-3aaa7.firebasestorage.app",messagingSenderId:"595095958991",appId:"1:595095958991:web:4f35828265029b4cad8eba"});
const db=firebase.firestore(),auth=firebase.auth();
let products=[],cart={};try{cart=JSON.parse(localStorage.cart||"{}")}catch(e){}
let cat="الكل",q="",editId=null,ordersUnsub=null,oldImg="";
const $=s=>document.querySelector(s);
const fmt=n=>Number(n||0).toLocaleString("en")+" د.ع";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const closeO=id=>$("#"+id).classList.remove("on");
document.title=STORE;$("#sn").textContent="💄 "+STORE;

db.collection("products").orderBy("createdAt","desc").onSnapshot(s=>{products=s.docs.map(d=>({id:d.id,...d.data()}));renderStore();renderPlist();if($("#cartOv").classList.contains("on"))openCart()},e=>{console.error(e);$("#empty").textContent="تعذّر تحميل المنتجات ("+(e.code||"خطأ")+")";$("#empty").classList.remove("hide")});

function renderStore(){
 $("#chips").innerHTML=["الكل",...CATS].map(c=>`<button class="chip ${c==cat?"on":""}" onclick="cat='${c}';renderStore()">${c}</button>`).join("");
 const l=products.filter(p=>(cat=="الكل"||p.category==cat)&&(!q||(p.name+" "+(p.brand||"")).toLowerCase().includes(q.toLowerCase())));
 $("#empty").classList.toggle("hide",l.length>0);
 $("#grid").innerHTML=l.map(p=>{const av=p.available!==false&&p.stock>0;return `<div class="card">${p.image?`<img src="${esc(p.image)}" alt="">`:`<div class="ph">💄</div>`}<div class="b"><span class="brand">${esc(p.brand)}</span><b style="font-size:14px">${esc(p.name)}</b><small>${esc((p.desc||"").slice(0,60))}</small>
 <div>${p.oldPrice>p.price?`<span class="old">${fmt(p.oldPrice)}</span><br>`:""}<span class="price">${fmt(p.price)}</span></div>
 ${av?`<button onclick="add('${p.id}')">أضف للسلة</button>`:`<span class="tag" style="background:var(--no)">غير متوفر</span>`}</div></div>`}).join("");
 $("#cc").textContent=Object.values(cart).reduce((a,b)=>a+b,0);
}
function save(){localStorage.cart=JSON.stringify(cart);renderStore()}
function add(id){cart[id]=(cart[id]||0)+1;save()}
function chg(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save();openCart()}
function cartItems(){return Object.entries(cart).map(([id,n])=>{const p=products.find(x=>x.id==id);return p&&{id,name:p.name,price:p.price,qty:n}}).filter(Boolean)}
function openCart(){
 const it=cartItems(),sub=it.reduce((a,i)=>a+i.price*i.qty,0);
 $("#cartBody").innerHTML=it.length?it.map(i=>`<div class="row"><span>${esc(i.name)}<br><small>${fmt(i.price)}</small></span><span><button class="ghost" onclick="chg('${i.id}',-1)">−</button> ${i.qty} <button class="ghost" onclick="chg('${i.id}',1)">+</button></span></div>`).join("")+
 `<div class="row"><span>المجموع</span><b>${fmt(sub)}</b></div><div class="row"><span>التوصيل</span><b>${fmt(FEE)}</b></div><div class="row"><b>الإجمالي</b><b class="price">${fmt(sub+FEE)}</b></div>
 <input id="cn" placeholder="الاسم"><input id="cp" type="tel" placeholder="رقم الهاتف"><input id="cg" placeholder="المحافظة"><textarea id="ca" rows="2" placeholder="العنوان بالتفصيل"></textarea>
 <small>الدفع عند الاستلام</small><br><button style="width:100%;margin-top:8px" onclick="order()">تأكيد الطلب</button>`:`<p style="padding:20px;text-align:center">السلة فارغة</p>`;
 $("#cartOv").classList.add("on");
}
async function order(){
 const it=cartItems(),v=id=>$("#"+id).value.trim();
 if(!it.length||!v("cn")||!v("cp")||!v("ca"))return alert("عبّي الاسم والهاتف والعنوان");
 const sub=it.reduce((a,i)=>a+i.price*i.qty,0);
 try{const r=await db.collection("orders").add({name:v("cn"),phone:v("cp"),governorate:v("cg"),address:v("ca"),items:it,subtotal:sub,fee:FEE,total:sub+FEE,status:"جديد",createdAt:firebase.firestore.FieldValue.serverTimestamp()});
 cart={};save();$("#cartBody").innerHTML=`<p style="padding:24px;text-align:center">✅ تم استلام طلبك<br>رقم الطلب: <b>${r.id.slice(0,6).toUpperCase()}</b><br>راح نتواصل وياك قريباً</p>`}
 catch(e){alert("صار خطأ، حاول مرة ثانية")}
}

// ===== المالك =====
function route(){const a=location.hash=="#admin";$("#store").classList.toggle("hide",a);$("#admin").classList.toggle("hide",!a)}
addEventListener("hashchange",route);route();
async function login(){try{await auth.signInWithEmailAndPassword($("#em").value.trim(),$("#pw").value)}catch(e){alert("الإيميل أو كلمة السر غلط")}}
auth.onAuthStateChanged(u=>{$("#login").classList.toggle("hide",!!u);$("#panel").classList.toggle("hide",!u);
 if(ordersUnsub){ordersUnsub();ordersUnsub=null}
 if(u)ordersUnsub=db.collection("orders").orderBy("createdAt","desc").onSnapshot(s=>renderOrders(s.docs.map(d=>({id:d.id,...d.data()}))),e=>{$("#to").innerHTML="<p>هذا الحساب ليس حساب المالك</p>"})});
function tab(t){$("#tp").classList.toggle("hide",t!="p");$("#to").classList.toggle("hide",t!="o")}
function renderPlist(){$("#plist").innerHTML=products.map(p=>`<div class="box"><div class="row" style="border:0"><b>${esc(p.name)}</b><small>${esc(p.category)}</small></div>
 <div style="display:flex;gap:6px;align-items:center">السعر:<input type="number" value="${p.price}" onchange="qp('${p.id}',+this.value)" style="width:110px"> مخزون:<input type="number" value="${p.stock}" onchange="qs('${p.id}',+this.value)" style="width:70px"></div>
 <div style="display:flex;gap:6px;margin-top:6px"><button class="${p.available!==false?"":"danger"}" onclick="tg('${p.id}',${p.available!==false})">${p.available!==false?"✅ متوفر":"⛔ غير متوفر"}</button><button class="ghost" onclick="editP('${p.id}')">تعديل</button><button class="danger" onclick="del('${p.id}')">حذف</button></div></div>`).join("")}
const up=(id,o)=>db.collection("products").doc(id).update(o).catch(()=>alert("ما تكدر تعدّل، تأكد من الدخول بحساب المالك"));
const qp=(id,v)=>up(id,{price:v}),qs=(id,v)=>up(id,{stock:v}),tg=(id,a)=>up(id,{available:!a});
const del=id=>confirm("حذف المنتج؟")&&db.collection("products").doc(id).delete();
function editP(id){editId=id||null;const p=products.find(x=>x.id==id)||{};oldImg=p.image||"";
 $("#pt").textContent=id?"تعديل منتج":"منتج جديد";$("#pc").innerHTML=CATS.map(c=>`<option ${c==p.category?"selected":""}>${c}</option>`).join("");
 $("#pn").value=p.name||"";$("#pb").value=p.brand||"";$("#pp").value=p.price||"";$("#po").value=p.oldPrice||"";$("#ps").value=p.stock??"";$("#pd").value=p.desc||"";$("#pa").checked=p.available!==false;$("#pf").value="";$("#pOv").classList.add("on")}
function shrink(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,500/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.7))};i.src=URL.createObjectURL(f)})}
async function saveP(){
 const f=$("#pf").files[0],d={name:$("#pn").value.trim(),brand:$("#pb").value.trim(),category:$("#pc").value,price:+$("#pp").value,oldPrice:+$("#po").value||0,stock:+$("#ps").value||0,desc:$("#pd").value.trim(),available:$("#pa").checked,image:f?await shrink(f):oldImg};
 if(!d.name||!d.price)return alert("اكتب الاسم والسعر");
 try{if(editId)await db.collection("products").doc(editId).update(d);else await db.collection("products").add({...d,createdAt:firebase.firestore.FieldValue.serverTimestamp()});closeO("pOv")}
 catch(e){alert("فشل الحفظ، تأكد من الدخول بحساب المالك")}}
function renderOrders(l){$("#to").innerHTML=l.length?l.map(o=>`<div class="box"><div class="row" style="border:0"><b>#${o.id.slice(0,6).toUpperCase()}</b><small>${o.createdAt?o.createdAt.toDate().toLocaleString("ar-IQ"):""}</small></div>
 <div>${esc(o.name)} • <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a><br><small>${esc(o.governorate)} - ${esc(o.address)}</small></div>
 <div style="margin:6px 0">${(o.items||[]).map(i=>`${esc(i.name)} × ${i.qty}`).join("<br>")}</div><b>${fmt(o.total)}</b>
 <select onchange="db.collection('orders').doc('${o.id}').update({status:this.value})">${STATUS.map(s=>`<option ${s==o.status?"selected":""}>${s}</option>`).join("")}</select></div>`).join(""):"<p>لا توجد طلبات</p>"}
renderStore();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
